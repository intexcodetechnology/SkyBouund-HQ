services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.3
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:80'
      - '127.0.0.1:5173:5173'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skybound
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?Set a local database bootstrap password}'
    volumes:
      - 'mysql-data:/var/lib/mysql'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?Set local MinIO username}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?Set local MinIO password}'
    ports:
      - '127.0.0.1:9001:9001'
    volumes:
      - 'minio-data:/data'
volumes:
  mysql-data:
  minio-data:
